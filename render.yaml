services:
  # ----------------------------------------------------
  # LearnSphere Backend (Spring Boot 4, Java 21, Docker)
  # ----------------------------------------------------
  - type: web
    name: learnsphere-backend
    env: docker
    dockerfilePath: ./learnsphere-backend/Dockerfile
    dockerContext: ./learnsphere-backend
    plan: free
    healthCheckPath: /api/courses
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # ----------------------------------------------------
  # LearnSphere Frontend (React 19 + Vite Static Site)
  # ----------------------------------------------------
  - type: web
    name: learnsphere-frontend
    env: static
    rootDir: ./learnsphere-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
