services:
  # ----------------------------------------------------
  # LearnSphere Backend (Spring Boot 4, Java 21, Docker)
  # ----------------------------------------------------
  - type: web
    name: learnsphere-backend
    env: docker
    dockerfilePath: ./learnsphere-backend/Dockerfile
    dockerContext: ./learnsphere-backend
    plan: free
    healthCheckPath: /api/courses
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:file:/app/data/learnsphere;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_DATASOURCE_PASSWORD
        value: ""
      - key: JWT_SECRET
        generateValue: true

  # ----------------------------------------------------
  # LearnSphere Frontend (React 19 + Vite Static Site)
  # ----------------------------------------------------
  - type: web
    name: learnsphere-frontend
    env: static
    rootDir: ./learnsphere-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: learnsphere-backend
          property: host
