<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="bShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="bArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="bArrowBack" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Banner -->
  <rect x="25" y="15" width="900" height="50" rx="6" fill="#1e3a8a" filter="url(#bShadow)"/>
  <text x="475" y="46" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">DIAGRAM 1: HIGH-LEVEL 3-TIER SYSTEM ARCHITECTURE</text>

  <!-- 1. Frontend Tier -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="240" height="310" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#bShadow)"/>
    <rect x="0" y="0" width="240" height="42" rx="8" fill="#2563eb"/>
    <rect x="0" y="34" width="240" height="8" fill="#2563eb"/>
    <text x="120" y="27" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">1. CLIENT TIER</text>
    <text x="120" y="70" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">React 19 Single Page App</text>
    
    <rect x="15" y="90" width="210" height="45" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="120" y="117" fill="#1e293b" font-size="12" font-weight="bold" text-anchor="middle">Student Learning Portal</text>

    <rect x="15" y="145" width="210" height="45" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="120" y="172" fill="#1e293b" font-size="12" font-weight="bold" text-anchor="middle">Instructor Course Studio</text>

    <rect x="15" y="200" width="210" height="45" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="120" y="227" fill="#1e293b" font-size="12" font-weight="bold" text-anchor="middle">Admin Control Center</text>

    <text x="120" y="280" fill="#64748b" font-size="11" text-anchor="middle">TailwindCSS • Responsive UI</text>
  </g>

  <!-- Connector 1 <-> 2 -->
  <line x1="285" y1="210" x2="350" y2="210" stroke="#0284c7" stroke-width="2.5" marker-end="url(#bArrow)"/>
  <text x="320" y="195" fill="#0284c7" font-size="10" font-weight="bold" text-anchor="middle">HTTP REST</text>
  <line x1="350" y1="250" x2="285" y2="250" stroke="#10b981" stroke-width="2.5" marker-end="url(#bArrowBack)"/>
  <text x="320" y="272" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">JSON Data</text>

  <!-- 2. Backend Tier -->
  <g transform="translate(355, 95)">
    <rect x="0" y="0" width="250" height="310" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#bShadow)"/>
    <rect x="0" y="0" width="250" height="42" rx="8" fill="#7c3aed"/>
    <rect x="0" y="34" width="250" height="8" fill="#7c3aed"/>
    <text x="125" y="27" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">2. APPLICATION TIER</text>
    <text x="125" y="70" fill="#5b21b6" font-size="13" font-weight="bold" text-anchor="middle">Spring Boot 4 REST API</text>

    <rect x="15" y="90" width="220" height="40" rx="4" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="125" y="115" fill="#1e293b" font-size="11.5" font-weight="bold" text-anchor="middle">Spring Security (JWT Filter)</text>

    <rect x="15" y="140" width="220" height="40" rx="4" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="125" y="165" fill="#1e293b" font-size="11.5" font-weight="bold" text-anchor="middle">Course &amp; Quiz Engine</text>

    <rect x="15" y="190" width="220" height="40" rx="4" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="125" y="215" fill="#1e293b" font-size="11.5" font-weight="bold" text-anchor="middle">Code Sandbox (ProcessBuilder)</text>

    <rect x="15" y="240" width="220" height="40" rx="4" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="125" y="265" fill="#1e293b" font-size="11.5" font-weight="bold" text-anchor="middle">Certificate Generation</text>
  </g>

  <!-- Connector 2 <-> 3 -->
  <line x1="610" y1="210" x2="675" y2="210" stroke="#0284c7" stroke-width="2.5" marker-end="url(#bArrow)"/>
  <text x="642" y="195" fill="#0284c7" font-size="10" font-weight="bold" text-anchor="middle">JPA / SQL</text>
  <line x1="675" y1="250" x2="610" y2="250" stroke="#10b981" stroke-width="2.5" marker-end="url(#bArrowBack)"/>
  <text x="642" y="272" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">Entities</text>

  <!-- 3. Database Tier -->
  <g transform="translate(680, 95)">
    <rect x="0" y="0" width="230" height="310" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2" filter="url(#bShadow)"/>
    <rect x="0" y="0" width="230" height="42" rx="8" fill="#059669"/>
    <rect x="0" y="34" width="230" height="8" fill="#059669"/>
    <text x="115" y="27" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">3. DATABASE TIER</text>
    <text x="115" y="70" fill="#065f46" font-size="13" font-weight="bold" text-anchor="middle">MySQL 8.0 Relational DB</text>

    <rect x="15" y="90" width="200" height="38" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="115" y="114" fill="#1e293b" font-size="11.5" font-weight="bold" text-anchor="middle">users (Roles &amp; Passwords)</text>

    <rect x="15" y="135" width="200" height="38" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="115" y="159" fill="#1e293b" font-size="11.5" font-weight="bold" text-anchor="middle">courses, modules, lessons</text>

    <rect x="15" y="180" width="200" height="38" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="115" y="204" fill="#1e293b" font-size="11.5" font-weight="bold" text-anchor="middle">enrollments (Unique Key)</text>

    <rect x="15" y="225" width="200" height="38" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="115" y="249" fill="#1e293b" font-size="11.5" font-weight="bold" text-anchor="middle">quizzes &amp; certificates</text>

    <text x="115" y="290" fill="#64748b" font-size="11" text-anchor="middle">Hibernate ORM • Connection Pool</text>
  </g>

  <!-- Bottom Explanatory Note -->
  <rect x="40" y="420" width="870" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="475" y="445" fill="#475569" font-size="11.5" text-anchor="middle">Decoupled Architecture: React communicates via stateless REST APIs. Tokens (JWT) authenticate every request securely.</text>
</svg>
