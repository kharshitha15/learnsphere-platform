<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="fShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="fArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5" />
    </marker>
    <marker id="retryArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Banner -->
  <rect x="25" y="15" width="950" height="50" rx="6" fill="#4338ca" filter="url(#fShadow)"/>
  <text x="500" y="46" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">DIAGRAM 2: STUDENT LEARNING &amp; CERTIFICATION LIFECYCLE</text>

  <!-- Step 1: Login -->
  <g transform="translate(35, 95)">
    <rect x="0" y="0" width="130" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#fShadow)"/>
    <circle cx="65" cy="30" r="16" fill="#3b82f6"/>
    <text x="65" y="36" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    <text x="65" y="65" fill="#1e3a8a" font-size="12" font-weight="bold" text-anchor="middle">STUDENT LOGIN</text>
    <text x="65" y="85" fill="#475569" font-size="10.5" text-anchor="middle">JWT Generated</text>
    <text x="65" y="100" fill="#475569" font-size="10" text-anchor="middle">Role: STUDENT</text>
  </g>

  <line x1="165" y1="150" x2="195" y2="150" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#fArrow)"/>

  <!-- Step 2: Course Discovery & Enrollment -->
  <g transform="translate(200, 95)">
    <rect x="0" y="0" width="145" height="110" rx="8" fill="#fdf4ff" stroke="#c084fc" stroke-width="2" filter="url(#fShadow)"/>
    <circle cx="72" cy="30" r="16" fill="#a855f7"/>
    <text x="72" y="36" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    <text x="72" y="65" fill="#581c87" font-size="12" font-weight="bold" text-anchor="middle">ENROLLMENT</text>
    <text x="72" y="85" fill="#475569" font-size="10.5" text-anchor="middle">Browse 8 Courses</text>
    <text x="72" y="100" fill="#7e22ce" font-size="9.5" font-weight="bold" text-anchor="middle">Anti-Duplicate Guard</text>
  </g>

  <line x1="345" y1="150" x2="375" y2="150" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#fArrow)"/>

  <!-- Step 3: Learning Player -->
  <g transform="translate(380, 95)">
    <rect x="0" y="0" width="165" height="110" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="2" filter="url(#fShadow)"/>
    <circle cx="82" cy="30" r="16" fill="#0891b2"/>
    <text x="82" y="36" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">3</text>
    <text x="82" y="65" fill="#164e63" font-size="12" font-weight="bold" text-anchor="middle">ACTIVE LEARNING</text>
    <text x="82" y="85" fill="#475569" font-size="10.5" text-anchor="middle">• Video Curriculum</text>
    <text x="82" y="100" fill="#475569" font-size="10.5" text-anchor="middle">• Live Code Sandbox</text>
  </g>

  <line x1="545" y1="150" x2="575" y2="150" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#fArrow)"/>

  <!-- Step 4: Module Quiz & Evaluation -->
  <g transform="translate(580, 75)">
    <rect x="0" y="0" width="170" height="150" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2" filter="url(#fShadow)"/>
    <circle cx="85" cy="26" r="16" fill="#ca8a04"/>
    <text x="85" y="32" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">4</text>
    <text x="85" y="60" fill="#713f12" font-size="12" font-weight="bold" text-anchor="middle">MODULE QUIZ</text>
    <text x="85" y="78" fill="#475569" font-size="10.5" text-anchor="middle">4–5 Multiple Choice Qs</text>
    
    <!-- Decision block inside -->
    <rect x="15" y="90" width="140" height="50" rx="4" fill="#ffffff" stroke="#fde047"/>
    <text x="85" y="108" fill="#b45309" font-size="11" font-weight="bold" text-anchor="middle">Pass Score ≥ 70%?</text>
    <text x="85" y="126" fill="#15803d" font-size="10" font-weight="bold" text-anchor="middle">YES ➔ Advance</text>
  </g>

  <!-- Pass connector -->
  <line x1="750" y1="150" x2="780" y2="150" stroke="#16a34a" stroke-width="2.5" marker-end="url(#fArrow)"/>

  <!-- Step 5: Certificate & Achievement -->
  <g transform="translate(785, 95)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#fShadow)"/>
    <circle cx="90" cy="30" r="16" fill="#16a34a"/>
    <text x="90" y="36" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">5</text>
    <text x="90" y="65" fill="#14532d" font-size="12" font-weight="bold" text-anchor="middle">100% COMPLETION</text>
    <text x="90" y="85" fill="#15803d" font-size="10.5" font-weight="bold" text-anchor="middle">CERT-LS-XXXX Issued</text>
    <text x="90" y="100" fill="#475569" font-size="10" text-anchor="middle">13 Badges &amp; Modal Cert</text>
  </g>

  <!-- Bottom Explanatory Workflow Box -->
  <g transform="translate(35, 255)">
    <rect x="0" y="0" width="930" height="190" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#fShadow)"/>
    <text x="25" y="30" fill="#1e293b" font-size="13" font-weight="bold">Key Workflow Highlights for Review Committee:</text>
    
    <text x="25" y="60" fill="#334155" font-size="12">• <tspan font-weight="bold">Step 1 (JWT Session):</tspan> Student logs in, receives token, frontend automatically attaches Authorization Bearer token to all requests.</text>
    
    <text x="25" y="90" fill="#334155" font-size="12">• <tspan font-weight="bold">Step 2 (Duplicate Protection):</tspan> If course is already enrolled, the platform routes to active progress instead of re-enrolling (guaranteed by SQL unique constraint).</text>
    
    <text x="25" y="120" fill="#334155" font-size="12">• <tspan font-weight="bold">Step 3 &amp; 4 (Hands-On Evaluation):</tspan> Students practice coding in the live sandbox and take module quizzes. Quizzes are automatically evaluated on the backend.</text>
    
    <text x="25" y="150" fill="#334155" font-size="12">• <tspan font-weight="bold">Step 5 (Verifiable Credential):</tspan> When all modules reach 100%, the backend generates a tamper-evident certificate ID and unlocks achievement badges.</text>
  </g>
</svg>
