version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: learnsphere_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: learnsphere
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - learnsphere_net

  # Spring Boot Backend Service
  backend:
    build: 
      context: ./learnsphere-backend
      dockerfile: Dockerfile
    container_name: learnsphere_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/learnsphere?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - db
    networks:
      - learnsphere_net

  # React Frontend Service (NGINX)
  frontend:
    build:
      context: ./learnsphere-frontend
      dockerfile: Dockerfile
    container_name: learnsphere_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - learnsphere_net

networks:
  learnsphere_net:
    driver: bridge

volumes:
  db_data:
